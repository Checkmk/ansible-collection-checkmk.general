---
- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create a BI pack."
  bi_pack:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ checkmk_var_bi_pack_id }}"
    title: "Ansible Test Pack"
    state: "present"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create BI aggregations."
  bi_aggregation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    comment: "{{ item.comment | default(omit) }}"
    customer: "{{ item.customer | default(omit) }}"
    groups: "{{ item.groups | default(omit) }}"
    node: "{{ item.node | default(omit) }}"
    aggregation_visualization: "{{ item.aggregation_visualization | default(omit) }}"
    computation_options: "{{ item.computation_options | default(omit) }}"
    state: "present"
  loop: "{{ checkmk_var_bi_aggregations }}"
  loop_control:
    label: "{{ item.name }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Get all BI aggregations of the pack."
  ansible.builtin.set_fact:
    __checkmk_var_bi_aggregations: "{{ lookup('checkmk.general.bi_aggregations',
                               pack_id=checkmk_var_bi_pack_id,
                               server_url=checkmk_var_server_url,
                               site=outer_item.site,
                               validate_certs=False,
                               api_user=checkmk_var_api_user,
                               api_secret=checkmk_var_api_secret) }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Verify the number of BI aggregations."
  ansible.builtin.assert:
    that: "__checkmk_var_bi_aggregations | length == checkmk_var_bi_aggregations | length"
    fail_msg: "Expected {{ checkmk_var_bi_aggregations | length }} aggregations, but found {{ __checkmk_var_bi_aggregations | length }}!"
    success_msg: "Expected {{ checkmk_var_bi_aggregations | length }} aggregations and found them."

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Verify the returned BI aggregations."
  ansible.builtin.assert:
    that:
      - "__checkmk_var_bi_aggregations | map(attribute='id') | sort == checkmk_var_bi_aggregations | map(attribute='name') | sort"
      - "__checkmk_var_bi_aggregations | map(attribute='comment') | sort == checkmk_var_bi_aggregations | map(attribute='comment') | sort"
    fail_msg: >-
      Expected the BI aggregations {{ checkmk_var_bi_aggregations | map(attribute='name') | sort }},
      but got {{ __checkmk_var_bi_aggregations }}.
    success_msg: "The bi_aggregations lookup returned the BI aggregations with their attributes."

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Get a single BI aggregation."
  ansible.builtin.set_fact:
    __checkmk_var_bi_aggregation: "{{ lookup('checkmk.general.bi_aggregation',
                              checkmk_var_bi_aggregation_id,
                              server_url=checkmk_var_server_url,
                              site=outer_item.site,
                              validate_certs=False,
                              api_user=checkmk_var_api_user,
                              api_secret=checkmk_var_api_secret) }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Verify the BI aggregation comment."
  ansible.builtin.assert:
    that: "__checkmk_var_bi_aggregation.comment == checkmk_var_bi_aggregation_comment"
    fail_msg: "Expected comment {{ checkmk_var_bi_aggregation_comment }}, but found {{ __checkmk_var_bi_aggregation.comment | default('nothing') }}!"
    success_msg: "Expected comment {{ checkmk_var_bi_aggregation_comment }} and found it."

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Pass several aggregation IDs as a list."
  ansible.builtin.assert:
    that: "__checkmk_var_bi_aggregations_by_id | length == checkmk_var_bi_aggregations | length"
    fail_msg: "Expected {{ checkmk_var_bi_aggregations | length }} results, but found {{ __checkmk_var_bi_aggregations_by_id | length }}!"
    success_msg: "Expected {{ checkmk_var_bi_aggregations | length }} results and found them."
  vars:
    __checkmk_var_bi_aggregations_by_id: "{{ query('checkmk.general.bi_aggregation',
                                     checkmk_var_bi_aggregations | map(attribute='name') | list,
                                     server_url=checkmk_var_server_url,
                                     site=outer_item.site,
                                     validate_certs=False,
                                     api_user=checkmk_var_api_user,
                                     api_secret=checkmk_var_api_secret) }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Use variables from inventory."
  block:

    - name: "{{ outer_item.version }}.{{ outer_item.edition }} - Get all BI aggregations of the pack."
      ansible.builtin.set_fact:
        __checkmk_var_bi_aggregations: "{{ lookup('checkmk.general.bi_aggregations', pack_id=checkmk_var_bi_pack_id) }}"

    - name: "{{ outer_item.version }}.{{ outer_item.edition }} - Verify the number of BI aggregations."
      ansible.builtin.assert:
        that: "__checkmk_var_bi_aggregations | length == checkmk_var_bi_aggregations | length"
        fail_msg: "Expected {{ checkmk_var_bi_aggregations | length }} aggregations, but found {{ __checkmk_var_bi_aggregations | length }}!"
        success_msg: "Expected {{ checkmk_var_bi_aggregations | length }} aggregations and found them."

    - name: "{{ outer_item.version }}.{{ outer_item.edition }} - Get a single BI aggregation."
      ansible.builtin.set_fact:
        __checkmk_var_bi_aggregation: "{{ lookup('checkmk.general.bi_aggregation', checkmk_var_bi_aggregation_id) }}"

    - name: "{{ outer_item.version }}.{{ outer_item.edition }} - Verify the BI aggregation comment."
      ansible.builtin.assert:
        that: "__checkmk_var_bi_aggregation.comment == checkmk_var_bi_aggregation_comment"
        fail_msg: "Expected comment {{ checkmk_var_bi_aggregation_comment }}, but found {{ __checkmk_var_bi_aggregation.comment | default('nothing') }}!"
        success_msg: "Expected comment {{ checkmk_var_bi_aggregation_comment }} and found it."

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete BI aggregations."
  bi_aggregation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    state: "absent"
  loop: "{{ checkmk_var_bi_aggregations }}"
  loop_control:
    label: "{{ item.name }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete the BI pack."
  bi_pack:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ checkmk_var_bi_pack_id }}"
    state: "absent"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Activate."
  activation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    force_foreign_changes: true
    sites:
      - "{{ outer_item.site }}"
