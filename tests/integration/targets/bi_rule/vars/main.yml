---
checkmk_var_test_sites:
  - version: "{{ checkmk_var_version }}"
    edition: "{{ checkmk_var_edition }}"
    site: "testsite"

checkmk_var_bi_pack_id: "ansible_test_pack"

checkmk_var_bi_rules_create:
  - pack_id: "ansible_test_pack"
    id: "ansible_test_rule"
    nodes: []
    properties:
      title: "Ansible Test Rule"
      comment: ""
      docu_url: ""
      icon: ""
      state_messages: {}
    aggregation_function:
      type: "worst"
      count: 1
      restrict_state: 2
    computation_options:
      disabled: false
    node_visualization:
      type: "block"
      style_config: {}

checkmk_var_bi_rules_modify:
  - pack_id: "ansible_test_pack"
    id: "ansible_test_rule"
    nodes: []
    properties:
      title: "Ansible Test Rule Modified"
      comment: "modified by the integration test"
      docu_url: ""
      icon: ""
      state_messages: {}
    aggregation_function:
      type: "best"
      count: 1
      restrict_state: 2
    computation_options:
      disabled: false
    node_visualization:
      type: "block"
      style_config: {}
