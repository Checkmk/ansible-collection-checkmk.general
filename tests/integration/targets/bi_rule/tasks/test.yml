---
- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create a BI pack to hold the rules."
  bi_pack:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ checkmk_var_bi_pack_id }}"
    title: "Ansible Test Pack"
    state: "present"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create BI rules."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    nodes: "{{ item.nodes }}"
    properties: "{{ item.properties }}"
    aggregation_function: "{{ item.aggregation_function }}"
    computation_options: "{{ item.computation_options }}"
    node_visualization: "{{ item.node_visualization }}"
    params: "{{ item.params | default(omit) }}"
    state: "present"
  register: __checkmk_var_result_bi_rule_create
  loop: "{{ checkmk_var_bi_rules_create }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: not __checkmk_var_result_bi_rule_create.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create BI rules again (idempotency)."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    nodes: "{{ item.nodes }}"
    properties: "{{ item.properties }}"
    aggregation_function: "{{ item.aggregation_function }}"
    computation_options: "{{ item.computation_options }}"
    node_visualization: "{{ item.node_visualization }}"
    params: "{{ item.params | default(omit) }}"
    state: "present"
  register: __checkmk_var_result_bi_rule_recreate
  loop: "{{ checkmk_var_bi_rules_create }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: __checkmk_var_result_bi_rule_recreate.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Modify BI rules."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    nodes: "{{ item.nodes }}"
    properties: "{{ item.properties }}"
    aggregation_function: "{{ item.aggregation_function }}"
    computation_options: "{{ item.computation_options }}"
    node_visualization: "{{ item.node_visualization }}"
    params: "{{ item.params | default(omit) }}"
    state: "present"
  register: __checkmk_var_result_bi_rule_modify
  loop: "{{ checkmk_var_bi_rules_modify }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: not __checkmk_var_result_bi_rule_modify.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Modify BI rules again (idempotency)."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    nodes: "{{ item.nodes }}"
    properties: "{{ item.properties }}"
    aggregation_function: "{{ item.aggregation_function }}"
    computation_options: "{{ item.computation_options }}"
    node_visualization: "{{ item.node_visualization }}"
    params: "{{ item.params | default(omit) }}"
    state: "present"
  register: __checkmk_var_result_bi_rule_remodify
  loop: "{{ checkmk_var_bi_rules_modify }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: __checkmk_var_result_bi_rule_remodify.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Check that the rule body is required when creating."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "ansible_test_rule_incomplete"
    pack: "{{ checkmk_var_bi_pack_id }}"
    state: "present"
  register: __checkmk_var_result_bi_rule_incomplete
  failed_when: "'following are missing' not in __checkmk_var_result_bi_rule_incomplete.msg"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete BI rules (identifiers only)."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    state: "absent"
  register: __checkmk_var_result_bi_rule_delete
  loop: "{{ checkmk_var_bi_rules_create }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: not __checkmk_var_result_bi_rule_delete.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete BI rules again (idempotency)."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    state: "absent"
  register: __checkmk_var_result_bi_rule_redelete
  loop: "{{ checkmk_var_bi_rules_create }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: __checkmk_var_result_bi_rule_redelete.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create a BI rule in check mode."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ checkmk_var_bi_rule_called.name }}"
    pack: "{{ checkmk_var_bi_rule_called.pack }}"
    nodes: "{{ checkmk_var_bi_rule_called.nodes }}"
    params: "{{ checkmk_var_bi_rule_called.params }}"
    properties: "{{ checkmk_var_bi_rule_called.properties }}"
    aggregation_function: "{{ checkmk_var_bi_rule_called.aggregation_function }}"
    computation_options: "{{ checkmk_var_bi_rule_called.computation_options }}"
    node_visualization: "{{ checkmk_var_bi_rule_called.node_visualization }}"
    state: "present"
  check_mode: true
  register: __checkmk_var_result_bi_rule_check
  failed_when: not __checkmk_var_result_bi_rule_check.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create the BI rule in check mode again, as it was not created."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ checkmk_var_bi_rule_called.name }}"
    pack: "{{ checkmk_var_bi_rule_called.pack }}"
    nodes: "{{ checkmk_var_bi_rule_called.nodes }}"
    params: "{{ checkmk_var_bi_rule_called.params }}"
    properties: "{{ checkmk_var_bi_rule_called.properties }}"
    aggregation_function: "{{ checkmk_var_bi_rule_called.aggregation_function }}"
    computation_options: "{{ checkmk_var_bi_rule_called.computation_options }}"
    node_visualization: "{{ checkmk_var_bi_rule_called.node_visualization }}"
    state: "present"
  check_mode: true
  register: __checkmk_var_result_bi_rule_check
  failed_when: not __checkmk_var_result_bi_rule_check.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create a BI rule and a rule that calls it, callee first."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    nodes: "{{ item.nodes }}"
    params: "{{ item.params }}"
    properties: "{{ item.properties }}"
    aggregation_function: "{{ item.aggregation_function }}"
    computation_options: "{{ item.computation_options }}"
    node_visualization: "{{ item.node_visualization }}"
    state: "present"
  register: __checkmk_var_result_bi_rule_chain
  loop:
    - "{{ checkmk_var_bi_rule_called }}"
    - "{{ checkmk_var_bi_rule_calling }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: not __checkmk_var_result_bi_rule_chain.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create both rules again (idempotency)."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    nodes: "{{ item.nodes }}"
    params: "{{ item.params }}"
    properties: "{{ item.properties }}"
    aggregation_function: "{{ item.aggregation_function }}"
    computation_options: "{{ item.computation_options }}"
    node_visualization: "{{ item.node_visualization }}"
    state: "present"
  register: __checkmk_var_result_bi_rule_chain
  loop:
    - "{{ checkmk_var_bi_rule_called }}"
    - "{{ checkmk_var_bi_rule_calling }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: __checkmk_var_result_bi_rule_chain.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Check that a rule that is still called cannot be deleted."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ checkmk_var_bi_rule_called.name }}"
    pack: "{{ checkmk_var_bi_rule_called.pack }}"
    state: "absent"
  register: __checkmk_var_result_bi_rule_in_use
  failed_when: __checkmk_var_result_bi_rule_in_use.http_code != 409

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Check that a BI pack that still holds rules cannot be deleted."
  bi_pack:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ checkmk_var_bi_pack_id }}"
    state: "absent"
  register: __checkmk_var_result_bi_pack_not_empty
  failed_when: "'It contains' not in __checkmk_var_result_bi_pack_not_empty.msg"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete the calling rule, then the called one."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    state: "absent"
  register: __checkmk_var_result_bi_rule_chain_delete
  loop:
    - "{{ checkmk_var_bi_rule_calling }}"
    - "{{ checkmk_var_bi_rule_called }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: not __checkmk_var_result_bi_rule_chain_delete.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete the BI pack."
  bi_pack:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ checkmk_var_bi_pack_id }}"
    state: "absent"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Activate."
  activation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    force_foreign_changes: true
    sites:
      - "{{ outer_item.site }}"
