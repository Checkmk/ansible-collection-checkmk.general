---
- name: "Check, whether the sites reside on this filesystem."
  ansible.builtin.stat:
    path: "/omd/sites/{{ outer_item.site }}"
  loop: "{{ checkmk_var_test_sites }}"
  loop_control:
    loop_var: outer_item
  register: __checkmk_var_result_bakery_site_paths

- name: "Inject a key into the sites on this filesystem."
  ansible.builtin.copy:
    src: agent_signature_keys.mk
    dest: /omd/sites/{{ outer_item.site }}/etc/check_mk/multisite.d/wato/agent_signature_keys.mk
    owner: "{{ outer_item.site }}"
    group: "{{ outer_item.site }}"
    mode: "0644"
  loop: "{{ __checkmk_var_result_bakery_site_paths.results | selectattr('stat.exists') | map(attribute='outer_item') | list }}"
  loop_control:
    loop_var: outer_item

- name: "Inject a key into the sites in neighbouring containers."  # noqa no-changed-when
  ansible.builtin.shell: |
    if command -v docker &> /dev/null; then
        for container in $(docker ps -q)
        do
          for site in $(docker exec $container ls /omd/sites/ 2>/dev/null)
          do
            docker cp {{ role_path }}/files/agent_signature_keys.mk $container:/omd/sites/$site/etc/check_mk/multisite.d/wato/agent_signature_keys.mk
          done
        done
    fi

    if command -v podman &> /dev/null; then
        for container in $(podman ps -q)
        do
          for site in $(podman exec $container ls /omd/sites/ 2>/dev/null)
          do
            podman cp {{ role_path }}/files/agent_signature_keys.mk $container:/omd/sites/$site/etc/check_mk/multisite.d/wato/agent_signature_keys.mk
          done
        done
    fi
  args:
    executable: /bin/bash
  when: __checkmk_var_result_bakery_site_paths.results | rejectattr('stat.exists') | list | length > 0

- name: "Testing."
  ansible.builtin.include_tasks: test.yml
  loop: "{{ checkmk_var_test_sites }}"
  loop_control:
    loop_var: outer_item
