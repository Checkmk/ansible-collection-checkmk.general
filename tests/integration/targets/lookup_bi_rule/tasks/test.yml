---
- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create a BI pack."
  bi_pack:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    pack:
      id: "{{ checkmk_var_bi_pack_id }}"
      title: "Ansible Test Pack"
    state: "present"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create BI rules."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    rule: "{{ item }}"
    state: "present"
  loop: "{{ checkmk_var_bi_rules }}"
  loop_control:
    label: "{{ item.id }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Get all BI rules of the pack."
  ansible.builtin.set_fact:
    __checkmk_var_bi_rules: "{{ lookup('checkmk.general.bi_rules',
                        pack_id=checkmk_var_bi_pack_id,
                        server_url=checkmk_var_server_url,
                        site=outer_item.site,
                        validate_certs=False,
                        api_user=checkmk_var_api_user,
                        api_secret=checkmk_var_api_secret) }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Verify the number of BI rules."
  ansible.builtin.assert:
    that: "__checkmk_var_bi_rules | length == checkmk_var_bi_rules | length"
    fail_msg: "Expected {{ checkmk_var_bi_rules | length }} rules, but found {{ __checkmk_var_bi_rules | length }}!"
    success_msg: "Expected {{ checkmk_var_bi_rules | length }} rules and found them."

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Verify the returned BI rules ids."
  ansible.builtin.assert:
    that: "__checkmk_var_bi_rules | sort == checkmk_var_bi_rules | map(attribute='id') | list | sort"
    fail_msg: >-
      Expected ids {{ checkmk_var_bi_rules | map(attribute='id') | list | sort }},
      but got {{ __checkmk_var_bi_rules }}.
    success_msg: "The bi_rules lookup returned the expected ids."

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Hydrate the ids into objects via the singular lookup."
  ansible.builtin.assert:
    that: "__checkmk_var_hydrated | map(attribute='id') | list | sort == checkmk_var_bi_rules | map(attribute='id') | list | sort"
    fail_msg: >-
      Feeding the ids to the bi_rule lookup returned
      {{ __checkmk_var_hydrated | map(attribute='id', default='<no id>') | list }}
      instead of {{ checkmk_var_bi_rules | map(attribute='id') | list | sort }}.
    success_msg: "The ids hydrate into BI rules carrying their ids."
  vars:
    # query() rather than lookup(): lookup() collapses a single result to the
    # bare object, and 'map' would then walk that object's keys instead of a
    # one-element list. query() is lookup(wantlist=True).
    __checkmk_var_hydrated: "{{ query('checkmk.general.bi_rule',
                        __checkmk_var_bi_rules,
                        server_url=checkmk_var_server_url,
                        site=outer_item.site,
                        validate_certs=False,
                        api_user=checkmk_var_api_user,
                        api_secret=checkmk_var_api_secret) }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Get a single BI rule."
  ansible.builtin.set_fact:
    __checkmk_var_bi_rule: "{{ lookup('checkmk.general.bi_rule',
                       checkmk_var_bi_rule_id,
                       server_url=checkmk_var_server_url,
                       site=outer_item.site,
                       validate_certs=False,
                       api_user=checkmk_var_api_user,
                       api_secret=checkmk_var_api_secret) }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Verify the BI rule title."
  ansible.builtin.assert:
    that: "__checkmk_var_bi_rule.properties.title == checkmk_var_bi_rule_title"
    fail_msg: "Expected title {{ checkmk_var_bi_rule_title }}, but found {{ __checkmk_var_bi_rule.properties.title | default('nothing') }}!"
    success_msg: "Expected title {{ checkmk_var_bi_rule_title }} and found it."

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Pass several rule IDs as a list."
  ansible.builtin.assert:
    that: "__checkmk_var_bi_rules_by_id | length == checkmk_var_bi_rules | length"
    fail_msg: "Expected {{ checkmk_var_bi_rules | length }} results, but found {{ __checkmk_var_bi_rules_by_id | length }}!"
    success_msg: "Expected {{ checkmk_var_bi_rules | length }} results and found them."
  vars:
    __checkmk_var_bi_rules_by_id: "{{ query('checkmk.general.bi_rule',
                              checkmk_var_bi_rules | map(attribute='id') | list,
                              server_url=checkmk_var_server_url,
                              site=outer_item.site,
                              validate_certs=False,
                              api_user=checkmk_var_api_user,
                              api_secret=checkmk_var_api_secret) }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Use variables from inventory."
  block:

    - name: "{{ outer_item.version }}.{{ outer_item.edition }} - Get all BI rules of the pack."
      ansible.builtin.set_fact:
        __checkmk_var_bi_rules: "{{ lookup('checkmk.general.bi_rules', pack_id=checkmk_var_bi_pack_id) }}"

    - name: "{{ outer_item.version }}.{{ outer_item.edition }} - Verify the number of BI rules."
      ansible.builtin.assert:
        that: "__checkmk_var_bi_rules | length == checkmk_var_bi_rules | length"
        fail_msg: "Expected {{ checkmk_var_bi_rules | length }} rules, but found {{ __checkmk_var_bi_rules | length }}!"
        success_msg: "Expected {{ checkmk_var_bi_rules | length }} rules and found them."

    - name: "{{ outer_item.version }}.{{ outer_item.edition }} - Get a single BI rule."
      ansible.builtin.set_fact:
        __checkmk_var_bi_rule: "{{ lookup('checkmk.general.bi_rule', checkmk_var_bi_rule_id) }}"

    - name: "{{ outer_item.version }}.{{ outer_item.edition }} - Verify the BI rule title."
      ansible.builtin.assert:
        that: "__checkmk_var_bi_rule.properties.title == checkmk_var_bi_rule_title"
        fail_msg: "Expected title {{ checkmk_var_bi_rule_title }}, but found {{ __checkmk_var_bi_rule.properties.title | default('nothing') }}!"
        success_msg: "Expected title {{ checkmk_var_bi_rule_title }} and found it."

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete BI rules."
  bi_rule:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    rule:
      pack_id: "{{ item.pack_id }}"
      id: "{{ item.id }}"
    state: "absent"
  loop: "{{ checkmk_var_bi_rules }}"
  loop_control:
    label: "{{ item.id }}"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete the BI pack."
  bi_pack:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    pack:
      id: "{{ checkmk_var_bi_pack_id }}"
    state: "absent"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Activate."
  activation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    force_foreign_changes: true
    sites:
      - "{{ outer_item.site }}"
