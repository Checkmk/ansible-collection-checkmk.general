---
- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create a BI pack to hold the aggregations."
  bi_pack:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ checkmk_var_bi_pack_id }}"
    title: "Ansible Test Pack"
    state: "present"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create BI aggregations."
  bi_aggregation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    comment: "{{ item.comment | default(omit) }}"
    customer: "{{ item.customer | default(omit) }}"
    groups: "{{ item.groups | default(omit) }}"
    node: "{{ item.node | default(omit) }}"
    aggregation_visualization: "{{ item.aggregation_visualization | default(omit) }}"
    computation_options: "{{ item.computation_options | default(omit) }}"
    state: "present"
  register: __checkmk_var_result_bi_aggregation_create
  loop: "{{ checkmk_var_bi_aggregations_create }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: not __checkmk_var_result_bi_aggregation_create.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Create BI aggregations again (idempotency)."
  bi_aggregation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    comment: "{{ item.comment | default(omit) }}"
    customer: "{{ item.customer | default(omit) }}"
    groups: "{{ item.groups | default(omit) }}"
    node: "{{ item.node | default(omit) }}"
    aggregation_visualization: "{{ item.aggregation_visualization | default(omit) }}"
    computation_options: "{{ item.computation_options | default(omit) }}"
    state: "present"
  register: __checkmk_var_result_bi_aggregation_recreate
  loop: "{{ checkmk_var_bi_aggregations_create }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: __checkmk_var_result_bi_aggregation_recreate.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Modify BI aggregations."
  bi_aggregation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    comment: "{{ item.comment | default(omit) }}"
    customer: "{{ item.customer | default(omit) }}"
    groups: "{{ item.groups | default(omit) }}"
    node: "{{ item.node | default(omit) }}"
    aggregation_visualization: "{{ item.aggregation_visualization | default(omit) }}"
    computation_options: "{{ item.computation_options | default(omit) }}"
    state: "present"
  register: __checkmk_var_result_bi_aggregation_modify
  loop: "{{ checkmk_var_bi_aggregations_modify }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: not __checkmk_var_result_bi_aggregation_modify.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Modify BI aggregations again (idempotency)."
  bi_aggregation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    comment: "{{ item.comment | default(omit) }}"
    customer: "{{ item.customer | default(omit) }}"
    groups: "{{ item.groups | default(omit) }}"
    node: "{{ item.node | default(omit) }}"
    aggregation_visualization: "{{ item.aggregation_visualization | default(omit) }}"
    computation_options: "{{ item.computation_options | default(omit) }}"
    state: "present"
  register: __checkmk_var_result_bi_aggregation_remodify
  loop: "{{ checkmk_var_bi_aggregations_modify }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: __checkmk_var_result_bi_aggregation_remodify.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete BI aggregations (identifiers only)."
  bi_aggregation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    state: "absent"
  register: __checkmk_var_result_bi_aggregation_delete
  loop: "{{ checkmk_var_bi_aggregations_create }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: not __checkmk_var_result_bi_aggregation_delete.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete BI aggregations again (idempotency)."
  bi_aggregation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ item.name }}"
    pack: "{{ item.pack }}"
    state: "absent"
  register: __checkmk_var_result_bi_aggregation_redelete
  loop: "{{ checkmk_var_bi_aggregations_create }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: __checkmk_var_result_bi_aggregation_redelete.changed

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Delete the BI pack."
  bi_pack:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    name: "{{ checkmk_var_bi_pack_id }}"
    state: "absent"

- name: "{{ outer_item.version }}.{{ outer_item.edition }} - Activate."
  activation:
    server_url: "{{ checkmk_var_server_url }}"
    site: "{{ outer_item.site }}"
    api_user: "{{ checkmk_var_api_user }}"
    api_secret: "{{ checkmk_var_api_secret }}"
    force_foreign_changes: true
    sites:
      - "{{ outer_item.site }}"
