# https://github.com/ansible-collections/collection_template/blob/main/.github/workflows/ansible-test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Role Agent

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
  pull_request:
    branches:
      - main
      - devel
    types:
      - opened
    paths:
      - 'roles/agent/**'
      - '.github/workflows/molecule-role-agent.yaml'
  push:
    paths:
      - 'roles/agent/**'
      - '!roles/**/*.md'
      - '.github/workflows/molecule-role-agent.yaml'

jobs:

  integration:
    name: "Molecule"
    uses: ./.github/workflows/_template-molecule-test.yaml
    with:
      role: agent
      # The Windows scenario cannot use containers. It boots a Windows Server VM
      # with Vagrant and libvirt, which takes considerably longer than the
      # container based scenarios and runs on virtualization that GitHub does not
      # officially support, hence 'experimental'.
      scenarios: >-
        [{"scenario": "2.3", "name": "Checkmk 2.3"},
         {"scenario": "2.4", "name": "Checkmk 2.4"},
         {"scenario": "2.5", "name": "Checkmk 2.5"},
         {"scenario": "windows", "name": "Checkmk 2.5 / Windows Server 2022",
          "virtualization": true, "experimental": true, "timeout": 60}]
