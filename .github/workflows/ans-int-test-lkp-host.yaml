concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Lookup Module Host Integration

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
  pull_request:
    branches:
      - main
      - devel
    types:
      - opened
    paths:
      - 'plugins/lookup/host.py'
      - 'plugins/lookup/hosts.py'
  push:
    paths:
      - '.github/workflows/ans-int-test-lkp-host.yaml'
      - 'plugins/lookup/host.py'
      - 'plugins/lookup/hosts.py'
      - 'plugins/module_utils/**'
      - 'tests/integration/targets/setup_checkmk/**'
      - 'tests/integration/targets/lookup_host/**'

jobs:

  integration:
    name: "${{ matrix.checkmk_version }}.${{ matrix.checkmk_edition }}"
    uses: ./.github/workflows/_template-ans-int-test.yaml
    with:
      module: lookup_host
      checkmk_version: ${{ matrix.checkmk_version }}
      checkmk_edition: ${{ matrix.checkmk_edition }}
    strategy:
      fail-fast: false
      matrix:
        checkmk_version:
          - 2.3.0p49
          - 2.4.0p36
          - 2.5.0p13
        checkmk_edition:
          - raw
          - managed
          - community
          - ultimatemt
        exclude:
          - checkmk_version: 2.3.0p49
            checkmk_edition: community
          - checkmk_version: 2.3.0p49
            checkmk_edition: ultimatemt
          - checkmk_version: 2.4.0p36
            checkmk_edition: community
          - checkmk_version: 2.4.0p36
            checkmk_edition: ultimatemt
          - checkmk_version: 2.5.0p13
            checkmk_edition: raw
          - checkmk_version: 2.5.0p13
            checkmk_edition: managed
