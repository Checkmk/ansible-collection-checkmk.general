---
minor_changes:
  - All modules - ``http_code``, ``content`` and ``etag`` are now
    returned by every module that talks to the REST API.
    Existing return values are unchanged, the keys are only added.
  - All modules - ``result_as_dict()`` was removed from
    ``module_utils.utils``. It returned a subset of the result and was what dropped
    the keys above. Every module exits through ``exit_module()`` now. This only
    affects code importing the helper directly from ``module_utils``, not playbooks
    or roles.
