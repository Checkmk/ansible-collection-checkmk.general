---
minor_changes:
  - Lookup plugins, Inventory plugin - ``CheckMKLookupAPI`` now encodes list valued query parameters
    as repeated keys, e.g. ``columns=name&columns=state``, which is the form the REST API expects.
    No plugin passes a list yet, so this only affects code importing the class directly from ``module_utils``,
    not playbooks or roles.
  - Lookup plugins, Inventory plugin - ``CheckMKLookupAPI`` gained a ``post()`` method alongside ``get()``,
    as groundwork for the monitoring collection endpoints, whose ``GET`` variants Checkmk 3.0 removes.
    None of the endpoints the lookup and inventory plugins currently use is a monitoring collection,
    so all of them keep using ``GET`` and nothing changes for playbooks or roles.
