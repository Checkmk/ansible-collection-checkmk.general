minor_changes:
  - Agent role - Ten role variables are now declared in
    ``meta/argument_specs.yml`` and are therefore type checked when the role
    starts, which they were not before. Most values are converted automatically,
    but a value that cannot be converted now fails the run
    instead of being passed through unchecked. A non numeric entry
    in ``checkmk_agent_port`` for example now aborts the role.
  - Server role - Ten role variables are now declared in
    ``meta/argument_specs.yml`` and are therefore type checked when the role
    starts, which they were not before. Most values are converted automatically,
    but a value that cannot be converted now fails the run
    instead of being passed through unchecked. A non numeric entry
    in ``checkmk_server_ports`` for example now aborts the role.

bugfixes:
  - Agent role - Raise ``min_ansible_version`` in ``meta/main.yml``
    from ``2.4`` to ``2.18``, matching ``requires_ansible`` in
    ``meta/runtime.yml``. This is no functional change, just an alignment.
  - Server role - Raise ``min_ansible_version`` in ``meta/main.yml``
    from ``2.4`` to ``2.18``, matching ``requires_ansible`` in
    ``meta/runtime.yml``. This is no functional change, just an alignment.
